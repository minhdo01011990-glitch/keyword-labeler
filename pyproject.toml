[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keyword-labeler"
version = "1.0.0"
description = "SEO keyword grouping plugin for Claude Desktop — tự động phân nhóm keyword bằng Claude Batch API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "minhdo01011990-glitch" }]
keywords = ["seo", "keyword", "claude", "mcp", "nlp", "vietnamese"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "anthropic>=0.40.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/minhdo01011990-glitch/keyword-labeler"
Repository = "https://github.com/minhdo01011990-glitch/keyword-labeler"
Issues = "https://github.com/minhdo01011990-glitch/keyword-labeler/issues"

[project.scripts]
keyword-labeler-server = "keyword_labeler.server:main"
keyword-labeler-install = "keyword_labeler.install:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keyword_labeler"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "skills/",
    "agents/",
    "install.sh",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
